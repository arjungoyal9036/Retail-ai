x-healthcheck: &app-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
  interval: 10s
  timeout: 3s
  retries: 5

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  catalog-service:
    build: .
    image: retail-assistant:local
    command: ["uvicorn", "services.catalog.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://mongodb:27017/retail
      MONGODB_DATABASE: retail_catalog
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck: *app-healthcheck

  customer-service:
    image: retail-assistant:local
    command: ["uvicorn", "services.customer.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://mongodb:27017/retail
      MONGODB_DATABASE: retail_profiles
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck: *app-healthcheck

  recommendation-service:
    image: retail-assistant:local
    command: ["uvicorn", "services.recommendation.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8000
      CUSTOMER_SERVICE_URL: http://customer-service:8000
    env_file:
      - .env
    depends_on:
      - catalog-service
      - customer-service
    healthcheck: *app-healthcheck

  chatbot-service:
    image: retail-assistant:local
    command: ["uvicorn", "services.chatbot.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8000
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8000
    depends_on:
      - catalog-service
      - recommendation-service
    healthcheck: *app-healthcheck

  gateway:
    image: retail-assistant:local
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8000
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8000
      CHATBOT_SERVICE_URL: http://chatbot-service:8000
      CUSTOMER_SERVICE_URL: http://customer-service:8000
    ports:
      - "8000:8000"
    depends_on:
      catalog-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
      chatbot-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    healthcheck: *app-healthcheck

volumes:
  mongo-data:
