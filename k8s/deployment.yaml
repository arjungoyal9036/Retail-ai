apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-assistant
  labels:
    app: retail-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retail-assistant
  template:
    metadata:
      labels:
        app: retail-assistant
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: retail-assistant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: retail-assistant
  labels:
    app: retail-assistant
spec:
  type: ClusterIP
  selector:
    app: retail-assistant
  ports:
    - name: http
      port: 80
      targetPort: http
